name: Publish to Ahmad's Archive
description: Add a new article, research paper, book, project, idea, or personal entry
title: "[New Content] "
body:

  - type: markdown
    attributes:
      value: |
        ## Ahmad Sadek — Personal Archive

        استخدم هذا النموذج لنشر مادة جديدة في الأرشيف.
        املأ الحقول المطلوبة، ويمكنك ترك الحقول الاختيارية فارغة.

  - type: dropdown
    id: content_type
    attributes:
      label: Content Type
      description: اختر نوع المادة
      options:
        - Article / مقال
        - Research / بحث
        - Book / كتاب
        - Project / مشروع
        - Idea / فكرة
        - Personal / شخصي
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: اختر البستان أو المجال الذي تنتمي إليه المادة
      options:
        - Medicine & Pharmacy / الطب والصيدلة
        - Engineering & Technology / الهندسة والتقنية
        - Thought & Philosophy / الفكر والفلسفة
        - Personal / المساحة الشخصية
        - Academic / أكاديمي
        - General / عام
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: لغة المادة
      options:
        - Arabic / العربية
        - English / English
        - Bilingual / ثنائية اللغة
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
      description: عنوان المقال أو البحث أو الكتاب أو المشروع
      placeholder: مثال — The Architecture of Curiosity
    validations:
      required: true

  - type: input
    id: subtitle
    attributes:
      label: Subtitle
      description: عنوان فرعي اختياري
      placeholder: جملة قصيرة تعطي القارئ فكرة عن المحتوى

  - type: input
    id: author
    attributes:
      label: Author
      value: Ahmad Sadek
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: التاريخ بصيغة YYYY-MM-DD
      placeholder: 2026-10-08

  - type: input
    id: tags
    attributes:
      label: Tags
      description: الكلمات المفتاحية مفصولة بفواصل
      placeholder: philosophy, learning, science

  - type: input
    id: reading_time
    attributes:
      label: Reading Time
      description: مدة القراءة التقريبية
      placeholder: 7 min

  - type: textarea
    id: cover_image
    attributes:
      label: Cover Image
      description: اختياري — يمكنك وضع رابط صورة أو سحب الصورة إلى هذا الحقل
      placeholder: Paste an image URL or upload an image here

  - type: textarea
    id: abstract
    attributes:
      label: Abstract / Summary
      description: ملخص قصير للمادة
      placeholder: اكتب ملخصًا واضحًا ومختصرًا...
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Content
      description: المحتوى الرئيسي للمادة. يمكنك استخدام Markdown وإضافة الصور والروابط.
      placeholder: ابدأ الكتابة هنا...

    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: المراجع والمصادر، خصوصًا للأبحاث والمقالات العلمية
      placeholder: |
        1. Author, A. (2026). Title...
        2. Journal / Book / Website...


  - type: textarea
    id: pdf
    attributes:
      label: PDF / Files
      description: اختياري — يمكنك سحب ملف PDF إلى هذا الحقل أو وضع رابط الملف
      placeholder: Upload or paste your PDF/file here

  - type: checkboxes
    id: publishing
    attributes:
      label: Publishing
      options:
        - label: I have reviewed this material and it is ready to appear publicly in Ahmad's Archive.
          required: true
