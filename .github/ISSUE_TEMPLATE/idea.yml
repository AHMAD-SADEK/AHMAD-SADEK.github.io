name: Idea / فكرة
description: Publish a short idea, question, observation, or note
title: "[Idea] "
body:
  - type: dropdown
    id: content_type
    attributes:
      label: Content Type
      options:
        - Idea / فكرة
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Thought & Philosophy / الفكر والفلسفة
        - Medicine & Pharmacy / الطب والصيدلة
        - Engineering & Technology / الهندسة والتقنية
        - Personal / المساحة الشخصية
        - General / عام
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Arabic / العربية
        - English / English
        - Bilingual / ثنائية اللغة
    validations:
      required: true

  - type: dropdown
    id: publication_status
    attributes:
      label: Publication Status
      options:
        - Published / منشور
        - Draft / مسودة
      default: 0
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD

  - type: input
    id: tags
    attributes:
      label: Tags

  - type: textarea
    id: content
    attributes:
      label: Content
      description: الفكرة نفسها، حتى لو كانت قصيرة.
    validations:
      required: true
