name: Personal / شخصي
description: Publish a personal reflection, experience, lesson, or journal entry
title: "[Personal] "
body:
  - type: markdown
    attributes:
      value: |
        **تنبيه مهم / Important:** المسودة لا تظهر في الأرشيف، لكن قضية GitHub نفسها عامة ويمكن للآخرين قراءتها. لا تضع كلمات مرور أو معلومات خاصة أو محتوى غير جاهز للنشر هنا.

  - type: dropdown
    id: content_type
    attributes:
      label: Content Type
      options:
        - Personal / شخصي
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Personal / المساحة الشخصية
        - Thought & Philosophy / الفكر والفلسفة
        - Academic / أكاديمي
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Arabic / العربية
        - English / English
        - Bilingual / ثنائية اللغة
    validations:
      required: true

  - type: dropdown
    id: publication_status
    attributes:
      label: Publication Status
      options:
        - Draft / مسودة
        - Published / منشور
      default: 0
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true

  - type: input
    id: subtitle
    attributes:
      label: Subtitle

  - type: input
    id: date
    attributes:
      label: Date
      placeholder: YYYY-MM-DD

  - type: input
    id: tags
    attributes:
      label: Tags

  - type: textarea
    id: cover_image
    attributes:
      label: Cover Image
      description: صورة اختيارية.

  - type: textarea
    id: content
    attributes:
      label: Content
      description: التجربة أو الفكرة أو النص الشخصي.
    validations:
      required: true

  - type: textarea
    id: second_language
    attributes:
      label: Second Language Version
      description: النسخة باللغة الثانية إذا كانت موجودة.
