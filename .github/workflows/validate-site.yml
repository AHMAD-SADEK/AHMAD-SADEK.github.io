name: Validate archive site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, site/archive-quality-and-security, audit/production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile scripts/build_archive.py tests/test_build_archive.py
      - name: Run archive security tests
        run: python -m unittest discover -s tests -v
      - name: Validate published archive JSON
        run: python -m json.tool archive.json > /dev/null
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/markdown.js
          node --check assets/js/app.js
          node --check assets/js/article.js
          node tests/test_markdown.js
      - name: Install browser regression-test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python -m http.server 4173 > /tmp/archive-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/archive-http.log
          exit 1
      - name: Test live navigation, language, search, and mobile menu
        run: npm run test:e2e
