name: Install Ahmad Sadek site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unpack the site package
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No site ZIP found in repository root."
            exit 1
          fi

          rm -rf assets archive writing research books projects pharmacy engineering thought personal ideas about contact entry data tools
          rm -rf .github/ISSUE_TEMPLATE .github/workflows
          rm -f index.html 404.html .nojekyll README-ARCHIVE.md

          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Commit installed site
        run: |
          git config user.name "Ahmad Sadek Site Installer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Install Ahmad Sadek personal archive"
          git push
