name: Build approved archive

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: build-approved-archive
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'AHMAD-SADEK'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive publication rules
        run: python -m unittest discover -s tests -v
      - name: Generate approved archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_archive.py
      - name: Commit changed archive data (retry concurrent updates)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_archive.py
            if git diff --quiet -- archive.json; then
              echo "Archive is already up to date."
              exit 0
            fi
            git add archive.json
            git commit -m "chore: update approved archive data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected on attempt $attempt; retrying."
            sleep "$attempt"
          done
          echo "Could not update archive after three attempts." >&2
          exit 1
