name: Build published archive

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/uploads/**"
      - ".github/workflows/build-approved-archive.yml"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-published-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test publication and rendering rules
        run: python -m unittest discover -s tests -v
      - name: Commit the generated archive (retry concurrent updates)
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_archive.py
            if [ -z "$(git status --porcelain -- archive.json articles/ sitemap.xml)" ]; then
              echo "Archive is already up to date."
              exit 0
            fi
            git add -A -- archive.json articles/ sitemap.xml
            git commit -m "chore: rebuild published archive"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent update detected on attempt $attempt; retrying."
            sleep "$attempt"
          done
          echo "Could not update archive after three attempts." >&2
          exit 1

      - name: Request GitHub Pages build after generated site changes
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages/builds"
