name: Build approved archive

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - "content/**"
      - "assets/uploads/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/build-approved-archive.yml"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write

concurrency:
  group: build-approved-archive
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'AHMAD-SADEK' && (github.event.sender.login == 'AHMAD-SADEK' || github.event.action == 'closed' || github.event.action == 'reopened'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive publication rules
        run: python -m unittest discover -s tests -v
      - name: Cache local translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-m2m100-418m-v1

      - name: Install local neural translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.48,<5" sentencepiece

      - name: Commit changed archive data (retry concurrent updates)
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HF_HOME: ~/.cache/huggingface
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_archive.py
            if [ -z "$(git status --porcelain -- archive.json articles/ sitemap.xml)" ]; then
              echo "Archive is already up to date."
              exit 0
            fi
            git add -A -- archive.json articles/ sitemap.xml
            git commit -m "chore: update approved archive data"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Concurrent update detected on attempt $attempt; retrying."
            sleep "$attempt"
          done
          echo "Could not update archive after three attempts." >&2
          exit 1

      - name: Request GitHub Pages build after generated site changes
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages/builds"
